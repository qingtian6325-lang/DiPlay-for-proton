name: Auto Build Proton APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build DiPlay for Proton (Android 5.1)
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: ./gradlew :mobile:assembleDebug --stacktrace

      - name: Prepare APK and USB Installer Package
        run: |
          mkdir -p dist
          cp mobile/build/outputs/apk/debug/mobile-debug.apk dist/DiPlay-for-Proton-Android5.1.apk
          python3 scripts/package_usb_installer.py

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DiPlay-Proton-X50-Files
          path: |
            dist/DiPlay-for-Proton-Android5.1.apk
            dist/DiPlay-Proton-X50-USB-Installer.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DiPlay-for-Proton-Android5.1.apk
            dist/DiPlay-Proton-X50-USB-Installer.zip
          name: ${{ github.ref_name }}
          body: |
            ## 🚗 DiPlay All-in-One Suite for Proton X50 (Android 5.1 / ECARX E01)

            ### 📦 Download Assets:
            1. **`DiPlay-Proton-X50-USB-Installer.zip`** (⭐ Recommended for Car IHU):
               - **All-in-One Ready-to-Unzip USB Installer Package!**
               - Bundles 4 essential apps for your Proton X50:
                 - 🍎 **DiPlay (Apple CarPlay)**: Native CarPlay with official Proton roaring tiger emblem return icon, Android 5.1.1 downward port.
                 - 🤖 **Headunit Reloaded (Android Auto)**: Full Android Auto support for Android phones.
                 - ⚙️ **Open Hidden Settings**: Access stock Android system settings, Developer Options, and ADB debugging.
                 - 📁 **Amaze File Manager**: Material Design file explorer to browse car storage, view logs, and export debug files to USB.
               - Includes all required native `.so` runtime libraries pre-extracted for Android 5.1 system app execution.
               - **Usage**: Format a USB drive as FAT32, unzip directly to USB root, insert into the lower console USB data port, and let it auto-install and reboot.
            2. **`DiPlay-for-Proton-Android5.1.apk`**:
               - Standalone APK file for DiPlay.
            
            - **Target Vehicle**: Proton X50 (Standard, Executive, Premium, Flagship)
            - **System**: Android 5.1.1 (API 22) / ECARX E01 SoC / ATLAS OS
            - **Installation Guide**: See [README.md](README.md) (English) or [README.zh-CN.md](README.zh-CN.md) (Chinese).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
